[project]
name = "aur-unreal-engine-src"
version = "0.1.0"
description = "Per-minor AUR PKGBUILD template renderer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.setuptools]
py-modules = ["render"]
